const QUOTE_STATUSES = ['Draft','Sent','Accepted','Rejected','Expired','Revised'];

function renderQuotes(root, params){
  let filter = 'ALL'; let custFilter = (params&&params.customerId) || null;
  function draw(){
    let rows = DB.quotes.slice().sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
    if(custFilter) rows = rows.filter(q=>q.customerId===custFilter);
    if(filter!=='ALL') rows = rows.filter(q=>q.status===filter);
    const custName = custFilter ? (getCustomer(custFilter)||{}).name : null;
    root.innerHTML = `
      <div class="viewhead">
        <div class="titles"><h1>Quotes${custName?' — '+escapeHtml(custName):''}</h1><p>Build a priced quotation, then convert an accepted one straight into a booking.</p></div>
        <div class="actions">
          ${custFilter?`<button class="btn ghost sm" onclick="navigateTo('quotes')">Clear customer filter</button>`:''}
          <button class="btn primary" id="btn-new-quote">➕ Prepare Quote</button>
        </div>
      </div>
      <div class="searchbar">
        <button class="chip-filter ${filter==='ALL'?'active':''}" data-f="ALL">All (${DB.quotes.length})</button>
        ${QUOTE_STATUSES.map(s=>`<button class="chip-filter ${filter===s?'active':''}" data-f="${s}">${s} (${DB.quotes.filter(q=>q.status===s).length})</button>`).join('')}
      </div>
      <div class="tblwrap"><table class="datatable"><thead><tr>
        <th>Quote ID</th><th>Customer</th><th>Issued</th><th>Expiry</th><th>Total</th><th>Status</th><th></th>
      </tr></thead><tbody>
        ${rows.length? rows.map(q=>{
          const c = getCustomer(q.customerId);
          const expired = q.status==='Sent' && q.expiryDate && q.expiryDate<todayISODate();
          return `<tr>
            <td class="muted small">${q.id}</td><td>${escapeHtml(c?c.name:'—')}</td>
            <td class="small">${fmtDateDMY(q.issueDate)}</td><td class="small">${fmtDateDMY(q.expiryDate)}</td>
            <td class="num">${fmtGBP(q.grossTotal)}</td>
            <td>${autoBadge(expired?'Expired':q.status)}</td>
            <td><button class="btn ghost sm" data-open="${q.id}">Open</button></td>
          </tr>`;
        }).join('') : `<tr class="emptyrow"><td colspan="7">${emptyState('No quotes yet.')}</td></tr>`}
      </tbody></table></div>
    `;
    root.querySelector('#btn-new-quote').addEventListener('click', ()=>openQuoteBuilder(null, custFilter));
    root.querySelectorAll('.chip-filter[data-f]').forEach(b=>b.addEventListener('click', ()=>{filter=b.getAttribute('data-f'); draw();}));
    root.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click', ()=>openQuoteDetail(b.getAttribute('data-open'))));
  }
  draw();
  if(params&&params.openNew) openQuoteBuilder(null, custFilter);
}

function openQuoteBuilder(existing, presetCustomerId){
  const isEdit = !!existing;
  let lines = existing ? JSON.parse(JSON.stringify(existing.lines)) : [];
  const activeCustomers = DB.customers.filter(c=>c.active!==false);
  const availableServices = DB.services.filter(s=>s.active);

  openModal(`
    <div class="modal-head"><h3>${isEdit?'Edit Quote':'Prepare Quote'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="formgrid">
        ${fField({id:'qf-customer', label:'Customer', type:'select', required:true,
            options:[['','— Select customer —']].concat(activeCustomers.map(c=>[c.id, c.name])),
            value: existing? existing.customerId : presetCustomerId})}
        ${fField({id:'qf-package', label:'Package', type:'select', options:DB.packageRules.map(p=>[p.id,p.label+(p.discountRate?' ('+(p.discountRate*100)+'% off)':'')]), value:existing?existing.packageId:'No Package'})}
        ${fField({id:'qf-issuedate', label:'Issue date', type:'date', required:true, value:(existing&&existing.issueDate)||todayISODate()})}
        ${fField({id:'qf-expirydate', label:'Expiry date', type:'date', required:true, value:(existing&&existing.expiryDate)|| addDays(todayISODate(),14).toISOString().slice(0,10)})}
        ${fField({id:'qf-promo', label:'Promotion (optional)', type:'select', options:[['','— None —']].concat(DB.promotions.filter(p=>p.active).map(p=>[p.id,p.name])), value:existing&&existing.promotionId})}
        ${fField({id:'qf-manualdisc', label:'Extra manual discount (%)', type:'number', min:'0', value:existing?existing.manualDiscountPercent:0, hint:'Requires owner approval before sending'})}
      </div>
      <h4>Services</h4>
      <div id="quote-lines-container"></div>
      <button class="btn ghost sm" id="qf-addline">➕ Add service line</button>
      <div id="quote-totals-container" style="margin-top:12px;"></div>
      <hr class="sep">
      ${fField({id:'qf-assumptions', label:'Assumptions', type:'textarea', rows:2, value: existing? existing.assumptions : DB.settings.customerActionsTerms})}
      ${fField({id:'qf-exclusions', label:'Exclusions', type:'textarea', rows:2, value: existing? existing.exclusionsNote : DB.settings.exclusionsNote})}
      ${fField({id:'qf-notes', label:'Customer notes', type:'textarea', rows:2, value:existing&&existing.customerNotes})}
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn ghost" id="qf-savedraft">Save Draft</button>
      <button class="btn primary" id="qf-save">${isEdit?'Save changes':'Save Quote'}</button>
    </div>
  `, {wide:true});

  function renderLines(){
    const c = document.getElementById('quote-lines-container');
    c.innerHTML = `<div class="tblwrap"><table class="datatable"><thead><tr>
      <th>Service</th><th>Tier</th><th>Qty/Hours</th><th>Rate £</th><th>Amount</th><th></th>
    </tr></thead><tbody>
      ${lines.length? lines.map((l,idx)=>`<tr>
        <td><select data-li="${idx}" data-f="serviceId" style="width:100%;">
          ${availableServices.map(s=>`<option value="${s.id}" ${l.serviceId===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
        </select></td>
        <td><select data-li="${idx}" data-f="tier" style="width:100%;"></select></td>
        <td><input type="number" min="0" step="0.25" data-li="${idx}" data-f="qty" value="${l.qty}" style="width:70px;"></td>
        <td><input type="number" min="0" step="0.01" data-li="${idx}" data-f="rate" value="${l.rate}" style="width:80px;"></td>
        <td class="num tabular">${fmtGBP(l.amount)}</td>
        <td><button class="iconbtn" data-removeline="${idx}">🗑️</button></td>
      </tr>`).join('') : `<tr><td colspan="6" class="muted small" style="text-align:center;">No service lines yet — add one below.</td></tr>`}
    </tbody></table></div>`;
    // populate tier selects
    lines.forEach((l,idx)=>{
      const tierSel = c.querySelector(`select[data-li="${idx}"][data-f="tier"]`);
      const rows = getPriceRows(l.serviceId);
      tierSel.innerHTML = rows.map(r=>`<option value="${r.tier}" ${l.tier===r.tier?'selected':''}>${escapeHtml(r.tier)} ${r.rate!=null?'— '+fmtGBP(r.rate)+(r.basis==='hourly'?'/hr':''):'(DRAFT — set rate manually)'}</option>`).join('');
    });
    c.querySelectorAll('select[data-f="serviceId"]').forEach(el=>el.addEventListener('change', e=>{
      const idx = Number(e.target.getAttribute('data-li'));
      lines[idx].serviceId = e.target.value;
      const svc = getService(e.target.value);
      lines[idx].serviceName = svc.name;
      const rows = getPriceRows(e.target.value);
      const firstRow = rows[0];
      lines[idx].tier = firstRow? firstRow.tier : 'Standard';
      lines[idx].rate = firstRow&&firstRow.rate!=null ? firstRow.rate : 0;
      lines[idx].qty = lines[idx].qty || 1;
      lines[idx].amount = calcLineAmount(lines[idx].qty, lines[idx].rate);
      renderLines(); renderTotals();
    }));
    c.querySelectorAll('select[data-f="tier"]').forEach(el=>el.addEventListener('change', e=>{
      const idx = Number(e.target.getAttribute('data-li'));
      const row = getPriceRow(lines[idx].serviceId, e.target.value);
      lines[idx].tier = e.target.value;
      lines[idx].rate = row&&row.rate!=null ? row.rate : lines[idx].rate;
      if(row&&row.status==='draft') toast('This price is DRAFT and needs owner approval — set a manual rate for now.', 'info');
      lines[idx].amount = calcLineAmount(lines[idx].qty, lines[idx].rate);
      renderLines(); renderTotals();
    }));
    c.querySelectorAll('input[data-f="qty"], input[data-f="rate"]').forEach(el=>el.addEventListener('input', e=>{
      const idx = Number(e.target.getAttribute('data-li')); const f = e.target.getAttribute('data-f');
      lines[idx][f] = Number(e.target.value)||0;
      lines[idx].amount = calcLineAmount(lines[idx].qty, lines[idx].rate);
      renderTotals();
      const amtCell = c.querySelectorAll('tbody tr')[idx].querySelector('.num');
      if(amtCell) amtCell.textContent = fmtGBP(lines[idx].amount);
    }));
    c.querySelectorAll('[data-removeline]').forEach(el=>el.addEventListener('click', e=>{
      lines.splice(Number(e.target.getAttribute('data-removeline')),1); renderLines(); renderTotals();
    }));
  }
  function renderTotals(){
    const t = calcDocumentTotals(lines, fVal('qf-package'), fVal('qf-manualdisc'), 0);
    document.getElementById('quote-totals-container').innerHTML = `
      <div class="doc-totals" style="margin-left:auto;">
        <div><span>Subtotal</span><span class="tabular">${fmtGBP(t.subtotal)}</span></div>
        <div><span>Discount (${(t.discountRate*100).toFixed(1)}%)</span><span class="tabular">-${fmtGBP(t.discountAmount)}</span></div>
        <div><span>${DB.settings.vatRegistered?'VAT':'VAT'}</span><span class="tabular">${DB.settings.vatRegistered?fmtGBP(t.vatAmount):'£0.00 — Not VAT registered'}</span></div>
        <div class="grand"><span>Total</span><span class="tabular">${fmtGBP(t.grossTotal)}</span></div>
      </div>`;
  }
  document.getElementById('qf-addline').addEventListener('click', ()=>{
    const first = availableServices[0];
    const rows = first?getPriceRows(first.id):[];
    lines.push({id:'QL-'+uid(), serviceId:first?first.id:'', serviceName:first?first.name:'', tier: rows[0]?rows[0].tier:'Standard', qty:1, rate: rows[0]&&rows[0].rate!=null?rows[0].rate:0, amount:0});
    lines[lines.length-1].amount = calcLineAmount(lines[lines.length-1].qty, lines[lines.length-1].rate);
    renderLines(); renderTotals();
  });
  ['qf-package','qf-manualdisc'].forEach(id=>document.getElementById(id).addEventListener('change', renderTotals));
  renderLines(); renderTotals();

  function saveQuote(status){
    if(!validateRequired([['qf-customer','Customer'],['qf-issuedate','Issue date'],['qf-expirydate','Expiry date']])) return;
    if(!lines.length){ toast('Add at least one service line before saving.', 'error'); return; }
    const t = calcDocumentTotals(lines, fVal('qf-package'), fVal('qf-manualdisc'), 0);
    const rec = existing || { id: nextId(ID_PREFIXES.QTE), createdAt: nowISO() };
    const before = existing?JSON.parse(JSON.stringify(existing)):null;
    Object.assign(rec, {
      customerId: fVal('qf-customer'), packageId: fVal('qf-package'), promotionId: fVal('qf-promo'),
      manualDiscountPercent: Number(fVal('qf-manualdisc'))||0,
      issueDate: fVal('qf-issuedate'), expiryDate: fVal('qf-expirydate'),
      lines, assumptions: fVal('qf-assumptions'), exclusionsNote: fVal('qf-exclusions'), customerNotes: fVal('qf-notes'),
      status: status || rec.status || 'Draft',
      subtotal:t.subtotal, discountRate:t.discountRate, discountAmount:t.discountAmount, netAmount:t.netAmount,
      vatRate:t.vatRate, vatAmount:t.vatAmount, grossTotal:t.grossTotal,
    });
    if(!isEdit) DB.quotes.push(rec);
    logAudit(isEdit?'Update quote':'Create quote', 'Quote', rec.id, before, rec);
    markDirty(); closeModal(); navigateTo('quotes'); toast('Quote saved: '+rec.id, 'success');
    return rec;
  }
  document.getElementById('qf-savedraft').addEventListener('click', ()=>saveQuote('Draft'));
  document.getElementById('qf-save').addEventListener('click', ()=>saveQuote(existing?existing.status:'Draft'));
}

const BOOKING_STATUSES = ['Provisional','Confirmed','Completed','Cancelled'];

function findBookingConflict(staffId, serviceDate, startTime, endTime, excludeBookingId){
  if(!staffId || !serviceDate || !startTime) return null;
  return DB.bookings.find(b=>{
    if(b.id===excludeBookingId || b.status==='Cancelled') return false;
    if(b.assignedStaffId!==staffId || b.serviceDate!==serviceDate) return false;
    const bs=b.startTime||'00:00', be=b.endTime||'23:59';
    const ns=startTime||'00:00', ne=endTime||'23:59';
    return (ns < be) && (bs < ne); // overlap
  });
}

    box.innerHTML = svcId==='SVC-AFTERBUILD' ? `<div class="warnbox">⚠️ After-Builders Rescue Clean — a higher-risk service governed by the RAMS (Risk Assessment &amp; Method Statement). ${fField({id:'bf-rams', label:'Staff RAMS acknowledgment on file for this booking', type:'checkbox', value:existing&&existing.ramsAcknowledged})}</div>` : '';
  }
  updateRamsBox();
  const bfServiceSel = document.getElementById('bf-service');
  if(bfServiceSel) bfServiceSel.addEventListener('change', updateRamsBox);

  function doSave(force){
    const reqs = [['bf-date','Service date'],['bf-start','Start time']];
    if(!quote && !isEdit) reqs.push(['bf-customer','Customer']);
    if(!validateRequired(reqs)) return;
    const staffId = fVal('bf-staff');
    const conflict = !force && findBookingConflict(staffId, fVal('bf-date'), fVal('bf-start'), fVal('bf-end'), existing&&existing.id);
    if(conflict){
      const cc = getCustomer(conflict.customerId);
      document.getElementById('booking-conflict-warning').innerHTML = `<div class="dangerbox">⚠️ Scheduling conflict: this staff member already has a booking with ${escapeHtml(cc?cc.name:'another customer')} at ${conflict.startTime}–${conflict.endTime||'?'} on ${fmtDateDMY(conflict.serviceDate)}. Click Save again to confirm anyway.</div>`;
      document.getElementById('bf-save').setAttribute('data-force','1');
      return;
    }
    const custId = quote ? quote.customerId : (isEdit ? existing.customerId : fVal('bf-customer'));
    const svc = quote ? {id: quote.lines[0].serviceId, name: quote.lines.map(l=>l.serviceName).join(' + ')} : getService(fVal('bf-service'));
    const rec = existing || { id: nextId(ID_PREFIXES.BKG), createdAt: nowISO(), status:'Confirmed' };
    const before = existing?JSON.parse(JSON.stringify(existing)):null;
    Object.assign(rec, {
      customerId: custId, quoteId: quote?quote.id:(existing&&existing.quoteId), serviceId: svc?svc.id:'', serviceName: svc?svc.name:(existing&&existing.serviceName),
      serviceDate: fVal('bf-date'), startTime: fVal('bf-start'), endTime: fVal('bf-end'), assignedStaffId: staffId||null,
      priority: fVal('bf-priority'), accessRequirements: fVal('bf-access'),
      status: rec.status||'Confirmed', grossTotal: quote?quote.grossTotal:(existing&&existing.grossTotal)||0,
      consumerEarlyStartConsent: document.getElementById('bf-earlystart') ? fVal('bf-earlystart') : (existing&&existing.consumerEarlyStartConsent)||false,
      consumerLossOfRightAck: document.getElementById('bf-lossack') ? fVal('bf-lossack') : (existing&&existing.consumerLossOfRightAck)||false,
      ramsAcknowledged: document.getElementById('bf-rams') ? fVal('bf-rams') : (existing&&existing.ramsAcknowledged)||false,
    });
    if(isPackageQuote && !rec.packageInstanceId){
      const rate = quote.lines[0]?quote.lines[0].rate:0;
      const pkg = buildPackageInstance({customerId:custId, serviceId:svc.id, tier:quote.lines[0]?quote.lines[0].tier:'Standard', packageId:quote.packageId, startDate:fVal('bf-date'), standardRate:rate, plannedVisits:Number(fVal('bf-plannedvisits'))||1, quoteId:quote.id, bookingId:rec.id,
        contractedHoursPerVisit:Number(fVal('bf-hoursvisit'))||1, visitFrequency:fVal('bf-visitfreq'), preferredWindow:fVal('bf-window')});
      DB.packageInstances.push(pkg); rec.packageInstanceId = pkg.id;
    }
    if(!isEdit) DB.bookings.push(rec);
    if(quote) quote.convertedBookingId = rec.id;
    logAudit(isEdit?'Update booking':'Confirm booking', 'Booking', rec.id, before, rec);
    // Auto-create the linked Job so nothing is re-typed at delivery time
    if(!isEdit && rec.status==='Confirmed' && !DB.jobs.find(j=>j.bookingId===rec.id)){
      const job = {
        id: nextId(ID_PREFIXES.JOB), bookingId: rec.id, customerId: custId,
        serviceAddress: (getCustomer(custId)||{}).serviceAddress||'', scheduledDate: rec.serviceDate,
        assignedStaffId: rec.assignedStaffId, checklist: defaultChecklistFor(svc?svc.name:''),
        productsRequired:'', coshhNote:'Follow product label and COSHH sheet for each chemical used.',
        arrivalTime:'', completionTime:'', staffNotes:'', beforePhoto:null, afterPhoto:null, photoConsent:false,
        customerRequests:'', problemsOrDamage:'', qualityControlResult:'', supervisorApproval:false,
        customerSignOff:'', status:'Scheduled', reworkRequired:false, createdAt: nowISO(),
      };
      DB.jobs.push(job);
      logAudit('Auto-create job from booking','Job',job.id,null,job.id);
    }
    markDirty(); closeModal(); navigateTo('bookings'); toast('Booking confirmed: '+rec.id, 'success');
  }
  document.getElementById('bf-save').addEventListener('click', ()=>doSave(document.getElementById('bf-save').getAttribute('data-force')==='1'));
}

function resizeImageFile(file, maxW, cb){
  const img = new Image(); const reader = new FileReader();
  reader.onload = e=>{ img.onload = ()=>{
    const scale = Math.min(1, maxW/img.width);
    const canvas = document.createElement('canvas');
    canvas.width = img.width*scale; canvas.height = img.height*scale;
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    cb(canvas.toDataURL('image/jpeg', 0.7));
  }; img.src = e.target.result; };
  reader.readAsDataURL(file);
}

    c.querySelectorAll('input[data-f]').forEach(el=>el.addEventListener('input', e=>{
      const idx=Number(e.target.getAttribute('data-li')), f=e.target.getAttribute('data-f');
      lines[idx][f] = f==='serviceName'? e.target.value : Number(e.target.value)||0;
      lines[idx].amount = calcLineAmount(lines[idx].qty, lines[idx].rate);
      renderTotals();
      if(f!=='serviceName'){ const cell=c.querySelectorAll('tbody tr')[idx].querySelector('.num'); if(cell) cell.textContent=fmtGBP(lines[idx].amount); }
    }));
    c.querySelectorAll('[data-rm]').forEach(el=>el.addEventListener('click', e=>{ lines.splice(Number(e.target.getAttribute('data-rm')),1); renderInvLines(); renderTotals(); }));
  }

    const t = calcDocumentTotals(lines, null, 0, 0);
    document.getElementById('inv-totals-container').innerHTML = `<div class="doc-totals" style="margin-left:auto;">
      <div><span>Subtotal</span><span class="tabular">${fmtGBP(t.subtotal)}</span></div>

      <div class="grand"><span>Total</span><span class="tabular">${fmtGBP(t.grossTotal)}</span></div>
    </div>`;
  }
  document.getElementById('ifm-addline').addEventListener('click', ()=>{ lines.push({id:'IL-'+uid(), serviceName:'', description:'', qty:1, rate:0, amount:0}); renderInvLines(); renderTotals(); });
  renderInvLines(); renderTotals();
  document.getElementById('ifm-save').addEventListener('click', ()=>{
    if(!validateRequired([['ifm-customer','Customer'],['ifm-date','Invoice date'],['ifm-due','Due date']])) return;
    const t = calcDocumentTotals(lines, null, 0, 0);
    const rec = existing || { id: nextId(ID_PREFIXES.INV), createdAt: nowISO(), status:'Issued' };
    const before = existing?JSON.parse(JSON.stringify(existing)):null;
    Object.assign(rec, { customerId:fVal('ifm-customer'), invoiceDate:fVal('ifm-date'), dueDate:fVal('ifm-due'), lines,
      subtotal:t.subtotal, discountAmount:t.discountAmount, netAmount:t.netAmount, vatRate:t.vatRate, vatAmount:t.vatAmount, grossTotal:t.grossTotal });
    if(!isEdit) DB.invoices.push(rec);
    logAudit(isEdit?'Update invoice':'Create invoice', 'Invoice', rec.id, before, rec);
    markDirty(); closeModal(); navigateTo('invoices'); toast('Invoice saved: '+rec.id, 'success');
  });
}

        ${pays.length? pays.map(p=>{ const inv=getInvoice(p.invoiceId); const c=inv?getCustomer(inv.customerId):null; const rec=DB.communications.find(x=>false);

      </tbody></table></div>
      <hr class="sep">
      <h3>Credit notes &amp; refunds</h3>

        ${DB.creditNotes.concat(DB.refunds).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(x=>{ const isCredit = x.id.includes('CRN');
          return `<tr><td class="muted small">${x.id}</td><td>${isCredit?'Credit Note':'Refund'}</td><td class="small">${x.invoiceId}</td><td class="num">${fmtGBP(x.amount)}</td><td class="small">${fmtDateDMY(x.createdAt)}</td>

      </tbody></table></div>
    `;
    root.querySelector('#btn-new-payment').addEventListener('click', ()=>openPaymentForm());
    root.querySelectorAll('[data-print]').forEach(b=>b.addEventListener('click', ()=>{
      const p = DB.payments.find(x=>x.id===b.getAttribute('data-print'));
      printDocument(buildReceiptDocHtml(p), 'Receipt '+p.receiptId);
    }));
    root.querySelectorAll('[data-printcr]').forEach(b=>b.addEventListener('click', ()=>{
      const cid = b.getAttribute('data-printcr'); const isCredit = cid.includes('CRN');
      const x = isCredit ? DB.creditNotes.find(c=>c.id===cid) : DB.refunds.find(r=>r.id===cid);
      if(isCredit) printDocument(buildCreditNoteDocHtml(x), 'Credit Note '+x.id);
      else printDocument(buildRefundConfirmationHtml(x), 'Refund Confirmation '+x.id);
    }));
  }
  draw();
  if(params&&params.openNew) openPaymentForm();
}

function openPaymentForm(presetInvoiceId){
  const openInvoices = DB.invoices.filter(i=>{ const s=computeInvoiceStatus(i); return s!=='Paid'&&s!=='Cancelled'; });
  openModal(`
    <div class="modal-head"><h3>Record Payment</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      ${fField({id:'pf-invoice', label:'Invoice', type:'select', required:true, options:[['','— Select invoice —']].concat(openInvoices.map(i=>{ const c=getCustomer(i.customerId); const bal=calcInvoiceBalance(i); return [i.id, i.id+' — '+(c?c.name:'')+' — outstanding '+fmtGBP(bal.outstanding)]; })), value:presetInvoiceId})}
      <div class="formgrid">
        ${fField({id:'pf-date', label:'Payment date', type:'date', required:true, value:todayISODate()})}
        ${fField({id:'pf-amount', label:'Amount (£)', type:'number', step:'0.01', required:true})}
        ${fField({id:'pf-method', label:'Payment method', type:'select', options:['Bank Transfer','Card','Cash','Other'], value:DB.settings.defaultPaymentMethod})}
        ${fField({id:'pf-ref', label:'Transaction reference', placeholder:'optional'})}
      </div>
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="pf-save">Record Payment &amp; Issue Receipt</button></div>
  `);
  const invSel = document.getElementById('pf-invoice');
  function fillDefaultAmount(){ const inv=getInvoice(invSel.value); if(inv) document.getElementById('pf-amount').value = calcInvoiceBalance(inv).outstanding; }
  invSel.addEventListener('change', fillDefaultAmount); if(presetInvoiceId) fillDefaultAmount();
  document.getElementById('pf-save').addEventListener('click', ()=>{
    if(!validateRequired([['pf-invoice','Invoice'],['pf-date','Payment date'],['pf-amount','Amount']])) return;
    const inv = getInvoice(fVal('pf-invoice')); const amount = Number(fVal('pf-amount'))||0;
    const bal = calcInvoiceBalance(inv);
    // Capture form values now — confirmDialog() replaces this modal's DOM, so fVal() calls
    // inside onConfirm would otherwise read from fields that no longer exist.
    const payDate = fVal('pf-date'), payMethod = fVal('pf-method'), payRef = fVal('pf-ref');
    confirmDialog({
      title:'Confirm this payment', message:'This records the payment as received and issues a receipt.',
      details:[['Invoice', inv.id],['Amount', fmtGBP(amount)],['Method', payMethod],['Remaining after this payment', fmtGBP(Math.max(0,round2(bal.outstanding-amount)))]],
      confirmLabel:'Confirm payment received',
      onConfirm: ()=>{
        const pay = { id: nextId(ID_PREFIXES.REC).replace('-REC-','-PAY-'), invoiceId: inv.id, paymentDate: payDate, amount, method: payMethod, transactionRef: payRef, status:'Received', createdAt: nowISO() };
        const receipt = { id: nextId(ID_PREFIXES.REC), paymentId: pay.id, invoiceId: inv.id, customerId: inv.customerId, amount, date: payDate, method: payMethod, transactionRef: payRef };
        pay.receiptId = receipt.id;
        DB.payments.push(pay);
        DB._receiptsIndex = DB._receiptsIndex||{}; DB._receiptsIndex[pay.id]=receipt.id;
        DB._receipts = DB._receipts||[]; DB._receipts.push(receipt);
        logAudit('Record payment','Payment',pay.id,null,pay);
        logAudit('Issue receipt','Receipt',receipt.id,null,receipt);
        markDirty(); closeModal();
        navigateTo('payments'); toast('Payment recorded and receipt '+receipt.id+' issued.', 'success');
      }
    });
  });
}

const PURCHASE_ORDER_STATUSES = ['Draft','Sent','Confirmed','Fulfilled','Cancelled'];

function poTotals(po){
  const net = round2((po.lines||[]).reduce((s,l)=>s+(Number(l.total)||0),0));
  const tax = round2(Number(po.supplierTaxAmount)||0);
  return { net, tax, total: round2(net+tax) };
}

function renderSuppliers(root, params){
  let subview = (params&&params.sub) || 'suppliers';
  function draw(){
    root.innerHTML = `
      <div class="viewhead">
        <div class="titles"><h1>Suppliers &amp; Purchase Orders</h1><p>Supplier records and purchase authorisations — linked from Expenses for full traceability.</p></div>
      </div>

        <button class="chip-filter ${subview==='suppliers'?'active':''}" data-sv="suppliers">Suppliers</button>
        <button class="chip-filter ${subview==='orders'?'active':''}" data-sv="orders">Purchase Orders</button>
      </div>
      <div id="sup-sub"></div>
    `;
    root.querySelectorAll('[data-sv]').forEach(b=>b.addEventListener('click', ()=>{subview=b.getAttribute('data-sv'); draw();}));
    const sub = document.getElementById('sup-sub');
    if(subview==='suppliers') drawSuppliers(sub); else drawOrders(sub);
  }
  function drawSuppliers(sub){
    const rows = DB.suppliers.slice().sort((a,b)=>a.name.localeCompare(b.name));
    sub.innerHTML = `
      <div class="actions" style="margin-bottom:10px;"><button class="btn primary" id="btn-new-supplier">➕ Add Supplier</button></div>
      <div class="tblwrap"><table class="datatable"><thead><tr><th>Supplier</th><th>Contact</th><th>Phone / Email</th><th>Account ref</th><th>Status</th><th></th></tr></thead><tbody>
        ${rows.length? rows.map(s=>`<tr><td><b>${escapeHtml(s.name)}</b></td><td class="small">${escapeHtml(s.contactName||'—')}</td>
          <td class="small">${escapeHtml(s.phone||'—')}${s.email?' · '+escapeHtml(s.email):''}</td><td class="small">${escapeHtml(s.accountRef||'—')}</td>
          <td>${autoBadge(s.active===false?'Inactive':'Active')}</td><td><button class="btn ghost sm" data-open="${s.id}">Open</button></td></tr>`).join('')
          : `<tr class="emptyrow"><td colspan="6">${emptyState('No suppliers on file yet — add one to link it from Expenses and Purchase Orders.')}</td></tr>`}
      </tbody></table></div>
    `;
    sub.querySelector('#btn-new-supplier').addEventListener('click', ()=>openSupplierForm());
    sub.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click', ()=>openSupplierDetail(b.getAttribute('data-open'))));
  }
  function drawOrders(sub){
    const rows = DB.purchaseOrders.slice().sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
    const openOrders = rows.filter(p=>['Draft','Sent'].includes(p.status));
    const awaitingDelivery = rows.filter(p=>p.status==='Confirmed');
    const ytdValue = rows.filter(p=>p.status!=='Cancelled' && p.status!=='Draft').reduce((s,p)=>s+poTotals(p).total,0);
    sub.innerHTML = `
      <div class="grid cols-3" style="margin-bottom:14px;">
        ${statTile({label:'Draft / Sent — needs action', value:openOrders.length, accent: openOrders.length?'warning':'good'})}
        ${statTile({label:'Confirmed — awaiting delivery', value:awaitingDelivery.length, accent:'navy'})}
        ${statTile({label:'Committed spend (Confirmed+)', value:fmtGBP(ytdValue), accent:'orange'})}
      </div>
      <div class="actions" style="margin-bottom:10px;"><button class="btn primary" id="btn-new-po">➕ New Purchase Order</button></div>
      <div class="tblwrap"><table class="datatable"><thead><tr><th>PO number</th><th>Reference</th><th>Supplier</th><th>Order date</th><th>Delivery date</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>
        ${rows.length? rows.map(p=>{ const s=getSupplier(p.supplierId);
          return `<tr><td class="muted small">${p.id}</td><td class="small">${escapeHtml(p.purchaseReference||'—')}</td><td>${escapeHtml(s?s.name:'—')}</td>
          <td class="small">${fmtDateDMY(p.orderDate)}</td><td class="small">${p.deliveryDate?fmtDateDMY(p.deliveryDate):'—'}</td>
          <td class="num">${fmtGBP(poTotals(p).total)}</td><td>${autoBadge(p.status)}</td><td><button class="btn ghost sm" data-open="${p.id}">Open</button></td></tr>`;
        }).join('') : `<tr class="emptyrow"><td colspan="8">${emptyState('No purchase orders yet.')}</td></tr>`}
      </tbody></table></div>
    `;
    sub.querySelector('#btn-new-po').addEventListener('click', ()=>openPurchaseOrderForm());
    sub.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click', ()=>openPurchaseOrderDetail(b.getAttribute('data-open'))));
  }
  draw();
  if(params&&params.openNewSupplier) openSupplierForm();
  if(params&&params.openNewPO) openPurchaseOrderForm(null, params.presetSupplierId);
}

function openPurchaseOrderForm(existing, presetSupplierId){
  const isEdit = !!existing;
  let lines = existing ? JSON.parse(JSON.stringify(existing.lines||[])) : [{id:'POL-'+uid(), description:'', qty:1, unitCost:0, total:0}];
  const supplierOptions = [['','— Select supplier —']].concat(DB.suppliers.filter(s=>s.active!==false).map(s=>[s.id,s.name]));
  openModal(`
    <div class="modal-head"><h3>${isEdit?'Edit Purchase Order':'New Purchase Order'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="helpbox">This purchase order is an operational authorisation — the supplier's own accepted terms and the agreed specification govern the actual supply.</div>
      <div class="formgrid">
        ${fField({id:'pof-supplier', label:'Supplier', type:'select', required:true, options:supplierOptions, value:(existing&&existing.supplierId)||presetSupplierId})}
        ${fField({id:'pof-ref', label:'Purchase reference', placeholder:'your internal reference, e.g. a job or quote', value:existing&&existing.purchaseReference})}
        ${fField({id:'pof-date', label:'Order date', type:'date', required:true, value:(existing&&existing.orderDate)||todayISODate()})}
        ${fField({id:'pof-status', label:'Status', type:'select', options:PURCHASE_ORDER_STATUSES, value:(existing&&existing.status)||'Draft'})}
        ${fField({id:'pof-deliverydate', label:'Delivery date', type:'date', value:existing&&existing.deliveryDate})}
      </div>
      ${fField({id:'pof-deliveryaddr', label:'Delivery address', type:'textarea', rows:2, value:(existing&&existing.deliveryAddress)||DB.settings.businessAddressInternal})}
      <h4>Order lines</h4>
      <div id="po-lines-container"></div>
      <button class="btn ghost sm" id="pof-addline">➕ Add line</button>
      <div class="formgrid" style="margin-top:12px;">
        ${fField({id:'pof-suptax', label:'Supplier tax charged (£)', type:'number', step:'0.01', value:(existing&&existing.supplierTaxAmount)||0})}
      </div>
      <div id="po-totals-container" style="margin-top:8px;"></div>
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="pof-save">${isEdit?'Save changes':'Save Purchase Order'}</button></div>
  `, {wide:true});

  function renderLines(){
    const c = document.getElementById('po-lines-container');
    c.innerHTML = `<div class="tblwrap"><table class="datatable"><thead><tr><th>Description</th><th>Qty</th><th>Unit cost £</th><th>Total</th><th></th></tr></thead><tbody>
      ${lines.length? lines.map((l,idx)=>`<tr>
        <td><input type="text" data-li="${idx}" data-f="description" value="${escapeHtml(l.description)}" style="width:100%;"></td>
        <td><input type="number" min="0" step="0.5" data-li="${idx}" data-f="qty" value="${l.qty}" style="width:70px;"></td>
        <td><input type="number" min="0" step="0.01" data-li="${idx}" data-f="unitCost" value="${l.unitCost}" style="width:90px;"></td>
        <td class="num tabular">${fmtGBP(l.total)}</td>
        <td><button class="iconbtn" data-removeline="${idx}">🗑️</button></td>
      </tr>`).join('') : `<tr><td colspan="5" class="muted small" style="text-align:center;">No lines yet — add one below.</td></tr>`}
    </tbody></table></div>`;
    c.querySelectorAll('input[data-f="description"]').forEach(el=>el.addEventListener('input', e=>{
      lines[Number(e.target.getAttribute('data-li'))].description = e.target.value;
    }));
    c.querySelectorAll('input[data-f="qty"], input[data-f="unitCost"]').forEach(el=>el.addEventListener('input', e=>{
      const idx = Number(e.target.getAttribute('data-li')); const f = e.target.getAttribute('data-f');
      lines[idx][f] = Number(e.target.value)||0;
      lines[idx].total = calcLineAmount(lines[idx].qty, lines[idx].unitCost);
      renderTotals();
      const rowCell = c.querySelectorAll('tbody tr')[idx].querySelector('.num');
      if(rowCell) rowCell.textContent = fmtGBP(lines[idx].total);
    }));
    c.querySelectorAll('[data-removeline]').forEach(el=>el.addEventListener('click', e=>{
      lines.splice(Number(e.target.getAttribute('data-removeline')),1); renderLines(); renderTotals();
    }));
  }
  function renderTotals(){
    const net = round2(lines.reduce((s,l)=>s+(Number(l.total)||0),0));
    const tax = round2(Number(fVal('pof-suptax'))||0);
    document.getElementById('po-totals-container').innerHTML = `
      <div class="doc-totals" style="margin-left:auto;">
        <div><span>Net</span><span class="tabular">${fmtGBP(net)}</span></div>
        <div><span>Supplier tax</span><span class="tabular">${fmtGBP(tax)}</span></div>
        <div class="grand"><span>Order total</span><span class="tabular">${fmtGBP(round2(net+tax))}</span></div>
      </div>`;
  }
  document.getElementById('pof-addline').addEventListener('click', ()=>{
    lines.push({id:'POL-'+uid(), description:'', qty:1, unitCost:0, total:0});
    renderLines(); renderTotals();
  });
  document.getElementById('pof-suptax').addEventListener('input', renderTotals);
  renderLines(); renderTotals();

  document.getElementById('pof-save').addEventListener('click', ()=>{
    if(!validateRequired([['pof-supplier','Supplier'],['pof-date','Order date']])) return;
    if(!lines.length || lines.every(l=>!l.description)){ toast('Add at least one order line.', 'error'); return; }
    const rec = existing || { id: nextId(ID_PREFIXES.PO), createdAt: nowISO() };
    const before = existing?JSON.parse(JSON.stringify(existing)):null;
    Object.assign(rec, {
      supplierId:fVal('pof-supplier'), purchaseReference:fVal('pof-ref'), orderDate:fVal('pof-date'),
      status:fVal('pof-status'), deliveryDate:fVal('pof-deliverydate')||null, deliveryAddress:fVal('pof-deliveryaddr'),
      lines, supplierTaxAmount: Number(fVal('pof-suptax'))||0,
      authorisedName: (existing&&existing.authorisedName) || DB.currentUser.name, authorisedDate: (existing&&existing.authorisedDate) || todayISODate(),
    });
    if(!isEdit) DB.purchaseOrders.push(rec);
    logAudit(isEdit?'Update purchase order':'New purchase order','PurchaseOrder',rec.id,before,rec);
    markDirty(); closeModal(); navigateTo('suppliers',{sub:'orders'}); toast('Purchase order saved: '+rec.id, 'success');
  });
}

  const s = getSupplier(p.supplierId); const t = poTotals(p);

/* === MODULE:KEY CUSTODY ===
   Coded-reference key intake, custody log and return record — matches
   11_Apelix_Key_Custody_Form. Security rule (T&Cs clause 9.3): key tags and
   anything printed for physical attachment to a key show ONLY the coded
   reference — never the customer's name or address. The name/address link
   lives only in this office-use record. */
const KEY_CUSTODY_REASONS = ['Recurring Package','One-off booking'];

function suggestKeyCode(){ return 'KC-'+String(DB.keyCustody.length+1).padStart(3,'0'); }
function keyCustodyOverdue(k){ return k.status==='Held' && k.expectedHoldUntil && k.expectedHoldUntil < todayISODate(); }

function renderKeyCustody(root){
  let filter = 'HELD';
  function draw(){
    let rows = DB.keyCustody.slice().sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
    if(filter==='HELD') rows = rows.filter(k=>k.status==='Held');
    else if(filter==='RETURNED') rows = rows.filter(k=>k.status==='Returned to customer');
    else if(filter==='LOST') rows = rows.filter(k=>k.status==='Lost');
    const held = DB.keyCustody.filter(k=>k.status==='Held');
    const overdue = held.filter(keyCustodyOverdue);
    const lost = DB.keyCustody.filter(k=>k.status==='Lost');
    root.innerHTML = `

function openKeyCustodyForm(existing){
  const isEdit = !!existing;
  const custOptions = [['','— Select customer —']].concat(DB.customers.filter(c=>c.active!==false).map(c=>[c.id,c.name]));
  openModal(`
    <div class="modal-head"><h3>${isEdit?'Edit Key Intake':'Key Intake'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="helpbox">Store this log securely and separately from the keys themselves. Key tags show only the coded reference below — never the customer's name or address (T&amp;Cs clause 9.3).</div>
      <fieldset><legend>1. Key Intake</legend><div class="formgrid">
        ${fField({id:'kf-code', label:'Coded key reference (tag code — no name/address)', required:true, value:(existing&&existing.codedReference)||suggestKeyCode(), hint:'Written on the physical tag'})}
        ${fField({id:'kf-customer', label:'Linked customer (office use only)', type:'select', required:true, options:custOptions, value:existing&&existing.customerId})}
        ${fField({id:'kf-site', label:'Property / site (if more than one)', type:'select', options:[['','— Whole account / not specific —']], value:existing&&existing.siteId})}
        ${fField({id:'kf-date', label:'Date received', type:'date', required:true, value:(existing&&existing.dateReceived)||todayISODate()})}
        ${fField({id:'kf-receivedby', label:'Received by', required:true, value:(existing&&existing.receivedBy)||DB.currentUser.name})}
        ${fField({id:'kf-count', label:'Number of keys / fobs', type:'number', min:1, value:(existing&&existing.numberOfKeys)||1})}
        ${fField({id:'kf-reason', label:'Reason held', type:'select', options:KEY_CUSTODY_REASONS, value:existing&&existing.reasonHeld})}
        ${fField({id:'kf-until', label:'Expected hold-until / return date', type:'date', value:existing&&existing.expectedHoldUntil})}
      </div>
      ${fField({id:'kf-desc', label:'Description / condition', type:'textarea', rows:2, value:existing&&existing.descriptionCondition})}
      </fieldset>
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="kf-save">${isEdit?'Save changes':'Save Key Intake'}</button></div>
  `, {wide:true});
  const custSel = document.getElementById('kf-customer'); const siteSel = document.getElementById('kf-site');
  function refreshSites(){
    const sites = DB.sites.filter(s=>s.customerId===custSel.value);
    siteSel.innerHTML = `<option value="">— Whole account / not specific —</option>` + sites.map(s=>`<option value="${s.id}" ${existing&&existing.siteId===s.id?'selected':''}>${escapeHtml(s.label)}</option>`).join('');
  }
  custSel.addEventListener('change', refreshSites); refreshSites();
  document.getElementById('kf-save').addEventListener('click', ()=>{
    if(!validateRequired([['kf-code','Coded key reference'],['kf-customer','Linked customer'],['kf-date','Date received'],['kf-receivedby','Received by']])) return;
    const rec = existing || { id: nextId(ID_PREFIXES.KEY), createdAt: nowISO(), status:'Held', custodyLog:[] };
    const before = existing?JSON.parse(JSON.stringify(existing)):null;
    Object.assign(rec, {
      codedReference:fVal('kf-code'), customerId:fVal('kf-customer'), siteId:fVal('kf-site')||null,
      dateReceived:fVal('kf-date'), receivedBy:fVal('kf-receivedby'), numberOfKeys:Number(fVal('kf-count'))||1,
      reasonHeld:fVal('kf-reason'), expectedHoldUntil:fVal('kf-until')||null, descriptionCondition:fVal('kf-desc'),
    });
    if(!isEdit) DB.keyCustody.push(rec);
    logAudit(isEdit?'Update key intake':'New key intake','KeyCustody',rec.id,before,rec);
    markDirty(); closeModal(); navigateTo('keycustody'); toast('Key logged: '+rec.codedReference, 'success');
  });
}

      </tbody></table></div>
      ${k.status==='Held' ? `

      <button class="btn ghost sm" id="kcl-add">➕ Log key out</button>
      ` : ''}
      ${k.status==='Returned to customer' ? `<hr class="sep"><h4>Final return to customer</h4>

    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">Close</button>

function openKeyLogReturnForm(keyId, logIndex){
  const k = getKeyCustody(keyId); if(!k) return;
  openModal(`
    <div class="modal-head"><h3>Mark key returned to store</h3><button class="modal-close" onclick="closeModal()">✕</button></div>

      ${fField({id:'klr-date', label:'Date returned to store', type:'date', required:true, value:todayISODate()})}

  document.getElementById('klr-save').addEventListener('click', ()=>{

function openRiskAssessmentForm(existing){
  const isEdit = !!existing;
  const hazards = existing ? JSON.parse(JSON.stringify(existing.hazards)) : defaultHazardRows();
  const bookingOptions = [['','— Not linked to a booking —']].concat(DB.bookings.slice().sort((a,b)=>b.serviceDate.localeCompare(a.serviceDate)).slice(0,50).map(b=>{ const c=getCustomer(b.customerId); return [b.id, b.id+' — '+(c?c.name:'')+' — '+fmtDateDMY(b.serviceDate)]; }));
  openModal(`
    <div class="modal-head"><h3>${isEdit?'Edit Risk Assessment':'New Risk Assessment'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="helpbox">Regulation 3 of the Management of Health and Safety at Work Regulations 1999 requires a "suitable and sufficient" assessment. Score Likelihood and Severity 1 (low) to 5 (high) for the real conditions at this property — do not guess from the template.</div>
      <div class="formgrid">
        ${fField({id:'raf-booking', label:'Link to a booking (optional — fills property/service)', type:'select', options:bookingOptions, value:existing&&existing.bookingId})}
        ${fField({id:'raf-address', label:'Property / job address', required:true, value:existing&&existing.propertyAddress})}
        ${fField({id:'raf-service', label:'Service type', value:existing&&existing.servicePackage})}
        ${fField({id:'raf-assessedby', label:'Assessed by', required:true, value:(existing&&existing.assessedByName)||DB.currentUser.name})}
        ${fField({id:'raf-date', label:'Date of assessment', type:'date', required:true, value:(existing&&existing.assessmentDate)||todayISODate()})}
        ${fField({id:'raf-review', label:'Review date', type:'date', value:existing&&existing.reviewDate})}
      </div>
      <h4>Hazard log</h4>
      <p class="small muted">Score Likelihood × Severity for the controls actually in place. Anything scoring 15 or more needs further action before work starts — 8 or more is flagged for monitoring on the Legal Pack Status dashboard.</p>
      <div class="tblwrap"><table class="datatable"><thead><tr><th>Hazard</th><th>L</th><th>S</th><th>Risk</th><th>Further action needed</th></tr></thead><tbody id="ra-hazard-body"></tbody></table></div>
      ${fField({id:'raf-extra', label:'Additional site-specific hazards (optional)', type:'textarea', rows:2, value:existing&&existing.additionalHazardsNote})}
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="raf-save">${isEdit?'Save changes':'Save Risk Assessment'}</button></div>
  `, {wide:true});

  function renderHazardBody(){
    const tb = document.getElementById('ra-hazard-body');
    tb.innerHTML = hazards.map((h,idx)=>{
      const rating = riskRatingOf(h); const band = riskBandOf(rating);
      return `<tr>
        <td class="small"><b>${escapeHtml(h.hazard)}</b><div class="muted" style="font-size:11px;">${escapeHtml(h.whoMightBeHarmed)} — ${escapeHtml(h.existingControls)}</div></td>
        <td><input type="number" min="1" max="5" data-hz="${idx}" data-f="likelihood" value="${h.likelihood||''}" style="width:52px;"></td>
        <td><input type="number" min="1" max="5" data-hz="${idx}" data-f="severity" value="${h.severity||''}" style="width:52px;"></td>
        <td><span class="risk-chip ${band.cls}" data-riskchip="${idx}">${rating!=null?rating:'—'}</span></td>
        <td><input type="text" data-hz="${idx}" data-f="furtherAction" value="${escapeHtml(h.furtherAction||'')}" placeholder="action / none" style="width:100%;"></td>
      </tr>`;
    }).join('');
    tb.querySelectorAll('input[data-f="likelihood"], input[data-f="severity"]').forEach(el=>el.addEventListener('input', e=>{
      const idx = Number(e.target.getAttribute('data-hz')); const f = e.target.getAttribute('data-f');
      hazards[idx][f] = e.target.value ? clamp(Number(e.target.value),1,5) : null;
      const rating = riskRatingOf(hazards[idx]); const band = riskBandOf(rating);
      const chip = tb.querySelector(`[data-riskchip="${idx}"]`);
      chip.className = 'risk-chip '+band.cls; chip.textContent = rating!=null?rating:'—';
    }));
    tb.querySelectorAll('input[data-f="furtherAction"]').forEach(el=>el.addEventListener('input', e=>{
      hazards[Number(e.target.getAttribute('data-hz'))].furtherAction = e.target.value;
    }));
  }
  renderHazardBody();

  const bookingSel = document.getElementById('raf-booking');
  bookingSel.addEventListener('change', ()=>{
    const b = DB.bookings.find(x=>x.id===bookingSel.value); if(!b) return;
    const c = getCustomer(b.customerId);
    if(c){ const site = DB.sites.find(s=>s.customerId===c.id); document.getElementById('raf-address').value = (site&&site.address) || c.serviceAddress || ''; }
    document.getElementById('raf-service').value = b.serviceName||'';
  });

  document.getElementById('raf-save').addEventListener('click', ()=>{
    if(!validateRequired([['raf-address','Property / job address'],['raf-assessedby','Assessed by'],['raf-date','Date of assessment']])) return;
    const rec = existing || { id: nextId(ID_PREFIXES.RKA), createdAt: nowISO() };
    const before = existing?JSON.parse(JSON.stringify(existing)):null;
    Object.assign(rec, {
      bookingId: fVal('raf-booking')||null, propertyAddress: fVal('raf-address'), servicePackage: fVal('raf-service'),
      assessedByName: fVal('raf-assessedby'), assessmentDate: fVal('raf-date'), reviewDate: fVal('raf-review')||null,
      hazards, additionalHazardsNote: fVal('raf-extra'),
    });
    if(!isEdit) DB.riskAssessments.push(rec);
    logAudit(isEdit?'Update risk assessment':'New risk assessment','RiskAssessment',rec.id,before,rec);
    markDirty(); closeModal(); navigateTo('compliance',{sub:'risk'}); toast('Risk assessment saved: '+rec.id, 'success');
  });
}

function renderReports(root){
  const today = todayISODate();
  const last12 = [...Array(12)].map((_,i)=>{ const d=addMonths(today,-11+i); return d.toISOString().slice(0,7); });
  const monthly = last12.map(m=>({month:m, ...monthlyFinancials(m)}));
  const maxVal = Math.max(1, ...monthly.map(m=>Math.max(m.revenue,m.expenses)));

  const leadsBySource = {};
  DB.leads.forEach(l=>{ leadsBySource[l.source||'Unknown']=(leadsBySource[l.source||'Unknown']||0)+1; });
  const totalLeads = DB.leads.length;
  const wonLeads = DB.leads.filter(l=>l.status==='Won').length;
  const totalQuotes = DB.quotes.length;
  const acceptedQuotes = DB.quotes.filter(q=>q.status==='Accepted').length;
  const avgJobValue = DB.invoices.length ? round2(DB.invoices.reduce((s,i)=>s+i.grossTotal,0)/DB.invoices.length) : 0;
  const outstanding = round2(DB.invoices.reduce((s,i)=>s+calcInvoiceBalance(i).outstanding,0));
  const overdueTotal = round2(DB.invoices.filter(i=>computeInvoiceStatus(i)==='Overdue').reduce((s,i)=>s+calcInvoiceBalance(i).outstanding,0));
  const repeatCustomers = DB.customers.filter(c=> DB.bookings.filter(b=>b.customerId===c.id).length>1).length;

  const servicePerf = {};
  DB.invoices.forEach(i=>{ i.lines.forEach(l=>{ servicePerf[l.serviceName]=(servicePerf[l.serviceName]||0)+l.amount; }); });
  const serviceRows = Object.entries(servicePerf).sort((a,b)=>b[1]-a[1]);
  const seqSteps = ['var(--seq-100)','var(--seq-300)','var(--seq-500)','var(--seq-700)'];

  root.innerHTML = `
    <div class="viewhead"><div class="titles"><h1>Reports</h1><p>Built from your real linked records — not manually typed totals. Management figures, not tax advice.</p></div></div>
    <div class="grid cols-4" style="margin-bottom:14px;">
      ${statTile({label:'Leads → Won', value:totalLeads?Math.round(wonLeads/totalLeads*100)+'%':'—', sub:wonLeads+' of '+totalLeads, accent:'navy'})}
      ${statTile({label:'Quote acceptance', value:totalQuotes?Math.round(acceptedQuotes/totalQuotes*100)+'%':'—', sub:acceptedQuotes+' of '+totalQuotes, accent:'navy'})}
      ${statTile({label:'Average invoice value', value:fmtGBP(avgJobValue), accent:'orange'})}
      ${statTile({label:'Repeat customers', value:repeatCustomers, accent:'orange'})}
    </div>
    <div class="grid cols-3" style="margin-bottom:14px;">
      ${statTile({label:'Outstanding balance (all)', value:fmtGBP(outstanding), accent: outstanding?'warning':'good'})}
      ${statTile({label:'Overdue balance', value:fmtGBP(overdueTotal), accent: overdueTotal?'critical':'good'})}
      ${statTile({label:'Complaints / rework', value:DB.complaints.length+' / '+DB.jobs.filter(j=>j.reworkRequired).length, accent:'serious'})}
    </div>

    <div class="card">
      <h3>Revenue vs expenses — last 12 months</h3>
      <div class="viz-root" style="--surface-1:#fcfcfb;">
        <svg viewBox="0 0 720 200" width="100%" height="200" role="img" aria-label="Monthly revenue and expenses bar chart">
          ${monthly.map((m,i)=>{
            const x = 10 + i*59; const bw=22;
            const rh = Math.round((m.revenue/maxVal)*150); const eh = Math.round((m.expenses/maxVal)*150);
            return `<g>
              <rect x="${x}" y="${170-rh}" width="${bw}" height="${rh}" rx="3" fill="var(--seq-500)"><title>${m.month} revenue ${fmtGBP(m.revenue)}</title></rect>
              <rect x="${x+bw+2}" y="${170-eh}" width="${bw}" height="${eh}" rx="3" fill="var(--orange)" opacity="0.85"><title>${m.month} expenses ${fmtGBP(m.expenses)}</title></rect>
              <text x="${x+bw}" y="188" font-size="9" fill="var(--ink-muted)" text-anchor="middle">${m.month.slice(5)}</text>
            </g>`;
          }).join('')}
        </svg>
        <div class="small muted">■ Revenue (navy)　■ Expenses (orange) — hover a bar for the exact figure.</div>
      </div>
    </div>

    <div class="grid cols-2" style="margin-top:12px;">
      <div class="card">
        <h3>Leads by source</h3>
        ${Object.keys(leadsBySource).length ? Object.entries(leadsBySource).sort((a,b)=>b[1]-a[1]).map(([src,n])=>`
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
            <div class="small" style="width:150px;">${escapeHtml(src)}</div>
            <div style="flex:1; background:var(--surface-2); border-radius:4px; height:10px;"><div style="width:${Math.round(n/totalLeads*100)}%; background:var(--seq-500); height:10px; border-radius:4px;"></div></div>
            <div class="small tabular" style="width:24px; text-align:right;">${n}</div>
          </div>`).join('') : emptyState('No leads yet.')}
      </div>
      <div class="card">
        <h3>Revenue by service</h3>
        ${serviceRows.length? serviceRows.map(([name,val],i)=>`
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
            <div class="small" style="width:150px;">${escapeHtml(name)}</div>
            <div style="flex:1; background:var(--surface-2); border-radius:4px; height:10px;"><div style="width:${Math.round(val/(serviceRows[0][1]||1)*100)}%; background:${seqSteps[Math.min(i,3)]}; height:10px; border-radius:4px;"></div></div>
            <div class="small tabular" style="width:70px; text-align:right;">${fmtGBP(val)}</div>
          </div>`).join('') : emptyState('No invoiced revenue yet.')}
      </div>
    </div>

    <div class="card" style="margin-top:12px;">
      <h3>Export for your accountant or bookkeeper</h3>
      <p class="small muted">Downloads a CSV of invoices, payments and expenses. Management records — not professional tax advice.</p>
      <button class="btn primary" id="btn-export-csv">⬇️ Export accountant CSV</button>
    </div>
  `;
  document.getElementById('btn-export-csv').addEventListener('click', exportAccountantCSV);
}
function csvEscape(v){ v = (v===null||v===undefined)?'':String(v); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
function exportAccountantCSV(){
  const lines = [['Type','ID','Date','Party','Category/Service','Net','VAT','Gross','Status'].join(',')];
  DB.invoices.forEach(i=>{ const c=getCustomer(i.customerId); lines.push(['Invoice',i.id,i.invoiceDate,c?c.name:'',i.lines.map(l=>l.serviceName).join('; '),i.netAmount,i.vatAmount,i.grossTotal,computeInvoiceStatus(i)].map(csvEscape).join(',')); });
  DB.payments.forEach(p=>{ lines.push(['Payment',p.id,p.paymentDate,p.invoiceId,'',p.amount,0,p.amount,'Received'].map(csvEscape).join(',')); });
  DB.expenses.forEach(e=>{ lines.push(['Expense',e.id,e.expenseDate,e.supplier,e.category,e.netAmount,e.taxAmount,e.totalPaid,''].map(csvEscape).join(',')); });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='Apelix-Accountant-Export-'+todayISODate()+'.csv'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  logAudit('Export accountant CSV','System',null,null,null);
  toast('CSV exported.', 'success');
}

}
function buildTermsAndConditionsHtml(){

  }).join('');

    <h3>Part A — General Terms</h3>

    <h4>2. Quotations, Bookings and Formation of the Agreement</h4>
    <p class="small">2.1 Quotations are estimates based on the information you give us and are valid for 14 days unless stated otherwise. 2.2 A binding Agreement forms when we confirm your booking in writing (a "Booking Confirmation") or, if earlier, when we begin the Services with your agreement. 2.3 The final price may change if the actual property differs materially from the information quoted on — we will tell you before doing extra-price work and will not charge without your agreement.</p>
    <h4>3. Access to the Property</h4>
    <p class="small">3.1 You must ensure safe access at the agreed time. 3.2 For Packages, the Schedule 8 access condition also applies. 3.3 If we cannot access the Property through no fault of ours, we may charge a reasonable failed-access fee of ${mVal(biz.failedAccessFee!=null?fmtGBP(biz.failedAccessFee):null,'Failed-access fee')} and the visit will need rebooking. 3.4 Please secure or otherwise manage pets during the visit; we may reschedule if access is reasonably considered unsafe.</p>
    <h4>4. What Is Included and Excluded</h4>
    <p class="small">4.1 Scope is set out in the applicable Schedule. 4.2 Unless expressly agreed in writing, carpet cleaning, upholstery cleaning and external window cleaning are excluded from every Service. 4.3 We do not move heavy furniture/appliances, work at height beyond a standard domestic step stool, or handle biohazards, pest infestations or hazardous waste — these need a specialist and must be arranged separately.</p>

    <h4>7. Cancellation and Rescheduling (see also Part B, clause 17)</h4>

    <h3>Part B — Additional Terms for Consumer (Domestic) Customers</h3>

    <h4>19. Status as a Business Customer</h4>
    <p class="small">19.1 By booking in this capacity you confirm you are contracting wholly or mainly for business purposes and Part B does not apply.</p>
    <h4>20. No Statutory Cancellation Right</h4>

    <h4>21. Payment Terms</h4>
    <p class="small">21.1 Unless otherwise agreed in writing, invoices are payable within ${mVal(biz.businessPaymentTermDaysConfirmed?(biz.businessPaymentTermDays+' days'):null,'Business invoice payment term')} of the invoice date. 21.2 We may charge statutory interest and compensation on overdue business debts under the Late Payment of Commercial Debts (Interest) Act 1998.</p>
    <h4>22. Liability Cap for Business Customers</h4>
    <p class="small">22.1 Subject to clause 8.5, our total liability to a Business Customer for any Package or series of Services in a 12-month period is limited to the total fees paid for the Services giving rise to the claim in that period. 22.2 We do not accept liability for indirect or consequential loss (e.g. loss of business, contracts or profits).</p>
    <h4>23. Site Rules and Access</h4>

function buildPrivacyNoticeHtml(){

    <p class="small">DRAFT — prepared for solicitor review. Action needed before this notice goes live: register with the Information Commissioner's Office (ICO) and pay the annual data protection fee if not already done — a sole trader of this size normally falls into Tier 1 (from £52/year by direct debit). Source: ico.org.uk.</p>
    <h4>1. Who We Are</h4>

function buildRiskAssessmentHtml(r){
  const biz = DB.settings;
  return `<div class="doc-sheet">
    <div class="doc-head"><div><div class="doc-title">Risk Assessment — General Cleaning Operations</div><div class="doc-tagline">${escapeHtml(biz.tagline)}</div></div>
      <div class="biz"><img src="${currentLogoDataUri()}"><div><strong>${escapeHtml(biz.businessName)}</strong></div><div>${escapeHtml(biz.businessEmail)} | ${escapeHtml(biz.businessPhone)}</div></div></div>
    <p class="small">Regulation 3 of the Management of Health and Safety at Work Regulations 1999 requires a "suitable and sufficient" assessment. Score Likelihood and Severity 1 (low) to 5 (high) for the controls in place, then multiply for the Risk Rating. Anything scoring 15 or more needs further action before work starts, not just a note for later.</p>
    <div class="doc-meta-grid">
      <div><b>Property / job reference:</b> ${escapeHtml(r.bookingId||'—')}</div><div><b>Address:</b> ${escapeHtml(r.propertyAddress)}</div>
      <div><b>Service type:</b> ${escapeHtml(r.servicePackage||'—')}</div><div><b>Assessed by:</b> ${escapeHtml(r.assessedByName)}</div>
      <div><b>Date of assessment:</b> ${fmtDateDMY(r.assessmentDate)}</div><div><b>Review date:</b> ${r.reviewDate?fmtDateDMY(r.reviewDate):'—'}</div>
    </div>
    <table class="doctbl"><thead><tr><th>Hazard</th><th>Who might be harmed</th><th>Existing controls</th><th>L</th><th>S</th><th>Risk</th><th>Further action needed</th></tr></thead><tbody>
      ${r.hazards.map(h=>{ const rating=riskRatingOf(h);
        return `<tr><td class="small">${escapeHtml(h.hazard)}</td><td class="small">${escapeHtml(h.whoMightBeHarmed)}</td><td class="small">${escapeHtml(h.existingControls)}</td>
        <td class="num">${h.likelihood||'—'}</td><td class="num">${h.severity||'—'}</td><td class="num">${rating!=null?rating:'—'}</td><td class="small">${escapeHtml(h.furtherAction||(rating!=null?'none':'—'))}</td></tr>`;
      }).join('')}
    </tbody></table>
    ${r.additionalHazardsNote?`<p class="small"><b>Additional site-specific hazards:</b> ${escapeHtml(r.additionalHazardsNote)}</p>`:''}
    <div class="formgrid small" style="margin-top:10px;">
      <div>Assessed by (name &amp; signature): ${escapeHtml(r.assessedByName)}</div><div>Date: ${fmtDateDMY(r.assessmentDate)}</div>
      <div>Reviewed by (if different): _________________________</div><div>Next review date: ${r.reviewDate?fmtDateDMY(r.reviewDate):'_________________________'}</div>
    </div>
    <div class="doc-foot"><span>Document: ${r.id}</span><span>Controlled template — Page 1 of 1</span></div>
  </div>`;
}
function buildRamsAfterBuildersHtml(r){
  const biz = DB.settings;

    <p class="small">Puncture/cut-resistant gloves for debris, plus chemical-resistant gloves for cleaning; eye protection when dust/debris is present; an appropriate dust mask/respirator (at least FFP2); non-slip closed-toe footwear; knee protection if kneeling for extended periods.</p>

    <p class="small">Complete site pre-checks and put on PPE before entering. Carry out a visual hazard sweep — do not proceed if a pre-check hazard is found. Ventilate where possible. Remove protective film, tape and labels. Dry dust removal first (vacuum with an appropriate filter) before any wet cleaning. Damp-wipe top-to-bottom, far end of the room towards the exit. Clean floors last. Bag and remove waste from our own cleaning process only (not builders' waste). Final visual check and before/after photographs (clause 10 of the Terms and Conditions). Remove/clean PPE appropriately, then wash hands before leaving.</p>
    <h4>If Something Goes Wrong</h4>
    <p class="small">Injury: administer first aid if trained, call 999 if serious, then notify the office as soon as possible. Suspected hazardous material: stop work, leave the area, notify the client and the office. Property damage: notify the client and the office the same day — see clause 8 of the Terms and Conditions.</p>

}
function buildCoshhRecordHtml(c){

function buildCustomerStatementHtml(customerId){
  const c = getCustomer(customerId); const biz = DB.settings;
  const invs = DB.invoices.filter(i=>i.customerId===customerId);
  const totalInvoiced = round2(invs.reduce((s,i)=>s+i.grossTotal,0));
  const totalCredits = round2(DB.creditNotes.filter(cn=>invs.some(i=>i.id===cn.invoiceId)).reduce((s,cn)=>s+cn.amount,0));
  const totalRefunds = round2(DB.refunds.filter(r=>invs.some(i=>i.id===r.invoiceId)).reduce((s,r)=>s+r.amount,0));
  const totalReceived = round2(DB.payments.filter(p=>invs.some(i=>i.id===p.invoiceId)).reduce((s,p)=>s+p.amount,0));
  const outstanding = round2(invs.reduce((s,i)=>s+calcInvoiceBalance(i).outstanding,0));
  const overdueCount = invs.filter(i=>computeInvoiceStatus(i)==='Overdue').length;
  const openCount = invs.filter(i=>computeInvoiceStatus(i)!=='Paid'&&computeInvoiceStatus(i)!=='Cancelled').length;
  // Chronological account-activity ledger (debit = money owed, credit = money settled), running balance
  const entries = [];
  invs.forEach(i=> entries.push({date:i.invoiceDate, ref:i.id, description:'Invoice — '+((i.lines&&i.lines[0]&&i.lines[0].serviceName)||'Service'), debit:i.grossTotal, credit:0}));
  DB.payments.filter(p=>invs.some(i=>i.id===p.invoiceId)).forEach(p=> entries.push({date:p.paymentDate, ref:p.receiptId||p.id, description:'Payment received — '+escapeHtml(p.method||''), debit:0, credit:p.amount}));
  DB.creditNotes.filter(cn=>invs.some(i=>i.id===cn.invoiceId)).forEach(cn=> entries.push({date:cn.createdAt, ref:cn.id, description:'Credit note issued', debit:0, credit:cn.amount}));
  DB.refunds.filter(r=>invs.some(i=>i.id===r.invoiceId)).forEach(r=> entries.push({date:r.createdAt, ref:r.id, description:'Refund issued', debit:r.amount, credit:0}));
  entries.sort((a,b)=> new Date(a.date) - new Date(b.date));
  let running = 0;
  const ledgerRows = entries.map(e=>{ running = round2(running + e.debit - e.credit);
    return `<tr><td class="small">${fmtDateDMY(e.date)}</td><td class="muted small">${escapeHtml(e.ref||'—')}</td><td class="small">${e.description}</td><td class="num">${e.debit?fmtGBP(e.debit):''}</td><td class="num">${e.credit?fmtGBP(e.credit):''}</td><td class="num">${fmtGBP(running)}</td></tr>`;
  }).join('');
  return `<div class="doc-sheet">
    <div class="doc-head"><div><div class="doc-title">Customer Statement</div><div class="doc-tagline">${escapeHtml(biz.tagline)}</div></div>
      <div class="biz"><img src="${currentLogoDataUri()}"><div><strong>${escapeHtml(biz.businessName)}</strong></div><div>${escapeHtml(biz.businessEmail)} | ${escapeHtml(biz.businessPhone)}</div></div></div>
    <p class="small">Please quote the relevant invoice number when making or querying a payment.</p>
    <div class="doc-meta-grid">
      <div><b>Statement reference:</b> STMT-${customerId}-${todayISODate()}</div><div><b>Statement date:</b> ${fmtDateDMY(todayISODate())}</div>
      <div><b>Statement period:</b> ${entries.length?fmtDateDMY(entries[0].date):'—'} to ${fmtDateDMY(todayISODate())}</div><div><b>Customer ID:</b> ${customerId}</div>
      <div><b>Customer:</b> ${escapeHtml(c?c.name:'')}</div><div><b>Billing address:</b> ${escapeHtml(c?(c.billingAddress||c.serviceAddress||''):'')}</div>
    </div>
    <h4>Account Activity</h4>
    <table class="doctbl"><thead><tr><th>Date</th><th>Reference</th><th>Description</th><th>Debit</th><th>Credit</th><th>Balance</th></tr></thead><tbody>
      ${ledgerRows || `<tr class="emptyrow"><td colspan="6">${emptyState('No account activity recorded yet.')}</td></tr>`}
    </tbody></table>
    <h4>Account Summary</h4>
    <div class="doc-totals">
      <div><span>Total invoiced</span><span>${fmtGBP(totalInvoiced)}</span></div>
      <div><span>Credits</span><span>${fmtGBP(totalCredits)}</span></div>
      <div><span>Refunds</span><span>${fmtGBP(totalRefunds)}</span></div>
      <div><span>Payments received</span><span>${fmtGBP(totalReceived)}</span></div>
      <div><span>Open / overdue invoices</span><span>${openCount} / ${overdueCount}</span></div>
      <div><span>Payment status</span><span>${overdueCount>0?'Overdue amounts on account':(outstanding>0?'Balance outstanding':'Fully settled')}</span></div>
      <div class="grand"><span>Outstanding balance</span><span>${fmtGBP(outstanding)}</span></div>
    </div>
    <p class="small">${biz.vatRegistered?'':'Not VAT registered.'}</p>
    <div class="doc-foot"><span>Document: STMT-${customerId}</span><span>Controlled template — Page 1 of 1</span></div>
  </div>`;
}

function openDocGenerateModal(docId){
  const doc = DOCUMENT_CATALOG.find(d=>d.id===docId); if(!doc) return;
  if(doc.ctx==='none'){ printDocument(doc.gen(), doc.name); return; }
  const meta = DOC_CTX[doc.ctx]; const opts = meta.options();
  if(!opts.length){
    toast('No '+meta.noun+' yet — add one first.', 'error');
    if(meta.view) navigateTo(meta.view.key, meta.view.params);
    return;
  }
  openModal(`
    <div class="modal-head"><h3>Generate: ${escapeHtml(doc.name)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <p class="small muted">${escapeHtml(doc.desc)}</p>
      ${fField({id:'dgm-pick', label:meta.label, type:'select', options:[['','— Select —']].concat(opts)})}
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="dgm-go">Generate &amp; Print</button></div>
  `);
  document.getElementById('dgm-go').addEventListener('click', ()=>{
    const id = fVal('dgm-pick'); if(!id){ toast('Make a selection first.', 'error'); return; }
    const rec = meta.get(id); if(!rec){ toast('Record not found.', 'error'); return; }
    closeModal();
    printDocument(doc.gen(rec), doc.name+' — '+id);
  });
}

/* === CHANGE REQUESTS ===
   A plain-English log for "please change X" notes — a price, a service, a
   package, or a customer detail. This log never edits live data by itself:
   an Owner still has to make the actual edit by hand (Price List & Packages,
   Business Settings, or the customer's own record) and then come back and
   mark the request Completed. Pricing and customer-data changes always need
   that human look before they go live — nothing here applies automatically. */
const CHANGE_REQUEST_STATUSES = ['Open','In Review','Completed','Cancelled'];
const CHANGE_REQUEST_CATEGORIES = ['Pricing','Services & Packages','Customer Data','Website / App','Other'];

function renderChangeRequests(root){
  let filter = 'ALL';
  function draw(){
    let rows = DB.changeRequests.slice().sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
    if(filter!=='ALL') rows = rows.filter(r=>r.status===filter);
    root.innerHTML = `
      <div class="viewhead">
        <div class="titles"><h1>Change Requests</h1><p>Note down anything you'd like changed — a price, a service, a package, or a customer detail — in plain English.</p></div>
        <div class="actions"><button class="btn primary" id="btn-new-changereq">➕ Log a change request</button></div>
      </div>
      <div class="helpbox">
        <b>How this works:</b> logging a request here doesn't change anything on its own — think to-do list and paper trail, not auto-apply. For pricing or customer-data changes especially, an Owner still needs to make the actual edit — in Price List &amp; Packages, Business Settings, or the customer's own record — then come back and mark the request Completed.
      </div>
      <div class="searchbar">
        <button class="chip-filter ${filter==='ALL'?'active':''}" data-f="ALL">All (${DB.changeRequests.length})</button>
        ${CHANGE_REQUEST_STATUSES.map(s=>`<button class="chip-filter ${filter===s?'active':''}" data-f="${s}">${s} (${DB.changeRequests.filter(r=>r.status===s).length})</button>`).join('')}
      </div>
      <div class="tblwrap"><table class="datatable"><thead><tr>
        <th>ID</th><th>Logged</th><th>Category</th><th>What &amp; why</th><th>Requested by</th><th>Status</th><th></th>
      </tr></thead><tbody>
        ${rows.length? rows.map(r=>`<tr>
            <td class="muted small">${r.id}</td>
            <td class="small">${fmtDateDMY(r.date)}</td>
            <td class="small">${escapeHtml(r.category)}</td>
            <td class="small">${escapeHtml((r.description||'').slice(0,70))}${(r.description||'').length>70?'…':''}</td>
            <td class="small">${escapeHtml(r.requestedBy||'—')}</td>
            <td>${autoBadge(r.status)}</td>
            <td><button class="btn ghost sm" data-open="${r.id}">Open</button></td>
          </tr>`).join('') : `<tr class="emptyrow"><td colspan="7">${emptyState('No change requests logged yet.')}</td></tr>`}
      </tbody></table></div>
    `;
    root.querySelector('#btn-new-changereq').addEventListener('click', openNewChangeRequest);
    root.querySelectorAll('.chip-filter[data-f]').forEach(b=>b.addEventListener('click', ()=>{filter=b.getAttribute('data-f'); draw();}));
    root.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click', ()=>openChangeRequestDetail(b.getAttribute('data-open'))));
  }
  draw();
}

function openNewChangeRequest(){
  openModal(`<div class="modal-head"><h3>Log a change request</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    ${fField({id:'chg-category', label:'Category', type:'select', required:true, options:[['','— Select —']].concat(CHANGE_REQUEST_CATEGORIES.map(c=>[c,c]))})}
    ${fField({id:'chg-description', label:'What should change, and why?', type:'textarea', rows:4, required:true, placeholder:"e.g. Raise the Deep Shine Clean rate — a few customers have queried it and it hasn't moved since launch."})}
    ${fField({id:'chg-requestedby', label:'Requested by', value:DB.currentUser.name, required:true})}
    ${fField({id:'chg-date', label:'Date', type:'date', value:todayISODate(), required:true})}
    <div class="helpbox">Pricing and customer-data changes still need an Owner to make the edit by hand and mark this Completed — logging it here doesn't change anything automatically.</div>
  </div>
  <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="chg-save">Save request</button></div>`);
  document.getElementById('chg-save').addEventListener('click', ()=>{
    if(!validateRequired([['chg-category','Category'],['chg-description','Description'],['chg-requestedby','Requested by'],['chg-date','Date']])) return;
    const rec = {
      id: nextId(ID_PREFIXES.CHG),
      createdAt: nowISO(),
      date: fVal('chg-date'),
      category: fVal('chg-category'),
      description: fVal('chg-description'),
      requestedBy: fVal('chg-requestedby'),
      status: 'Open',
      reviewNote: '',
      resolvedAt: null,
      resolvedBy: null,
    };
    DB.changeRequests.push(rec);
    logAudit('Log change request','ChangeRequest',rec.id,null,rec);
    markDirty(); closeModal(); navigateTo('changerequests'); toast('Change request logged: '+rec.id, 'success');
  });
}

function openChangeRequestDetail(id){
  const r = DB.changeRequests.find(x=>x.id===id); if(!r) return;
  const isSensitive = r.category==='Pricing' || r.category==='Customer Data';
  openModal(`
    <div class="modal-head"><div><h3>Change Request ${r.id}</h3><span class="muted small">${escapeHtml(r.category)}</span></div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <p>${autoBadge(r.status)} · Logged ${fmtDateDMY(r.date)} by ${escapeHtml(r.requestedBy||'—')}</p>
      <p class="small" style="white-space:pre-wrap;">${escapeHtml(r.description)}</p>
      ${isSensitive?`<div class="warnbox">This touches ${r.category==='Pricing'?'live pricing':'customer data'} — make the actual edit yourself first (in Price List &amp; Packages, Business Settings, or the customer's record), then mark this Completed. Nothing here applies it for you.</div>`:''}
      ${r.resolvedAt?`<p class="small muted">Resolved ${fmtDateTimeDMY(r.resolvedAt)} by ${escapeHtml(r.resolvedBy||'—')}</p>`:''}
      ${fField({id:'chg-reviewnote', label:'Review note (optional)', type:'textarea', rows:3, value:r.reviewNote||'', hint:'What was actually done, or why it was declined.'})}
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">Close</button>
      ${r.status==='Open'?`<button class="btn ghost" id="chg-review-btn">Start review</button>`:''}
      ${r.status!=='Completed'&&r.status!=='Cancelled'?`<button class="btn primary" id="chg-complete-btn">Mark Completed</button>`:''}
      ${r.status!=='Completed'&&r.status!=='Cancelled'?`<button class="btn danger" id="chg-cancel-btn">Cancel request</button>`:''}
    </div>
  `);
  function resolve(newStatus){
    const before = {status:r.status, reviewNote:r.reviewNote};
    r.status = newStatus;
    r.reviewNote = fVal('chg-reviewnote')||'';
    if(newStatus==='Completed'||newStatus==='Cancelled'){ r.resolvedAt = nowISO(); r.resolvedBy = DB.currentUser.name; }
    logAudit('Update change request','ChangeRequest',r.id,before,{status:r.status, reviewNote:r.reviewNote});
    markDirty(); closeModal(); navigateTo('changerequests'); toast('Change request '+r.id+' updated.', 'success');
  }
  const reviewBtn = document.getElementById('chg-review-btn'); if(reviewBtn) reviewBtn.addEventListener('click', ()=>resolve('In Review'));
  const completeBtn = document.getElementById('chg-complete-btn'); if(completeBtn) completeBtn.addEventListener('click', ()=>resolve('Completed'));
  const cancelBtn = document.getElementById('chg-cancel-btn'); if(cancelBtn) cancelBtn.addEventListener('click', ()=>{
    confirmDialog({title:'Cancel this change request?', message:'It will be marked Cancelled and kept in the log for reference.', danger:true, confirmLabel:'Cancel request',
      onConfirm:()=>resolve('Cancelled')
    });
  });
}

function renderNav(){
  const items = visibleNavItems();
  const groups = {};
  items.forEach(i=>{ (groups[i.group]=groups[i.group]||[]).push(i); });
  const badges = navBadgeCounts();
  const sidenav = document.getElementById('sidenav');
  sidenav.innerHTML = Object.keys(groups).map(g=>`
    <div class="navgroup">
      <h4>${escapeHtml(g)}</h4>
      ${groups[g].map(i=>`
        <button class="navitem ${CURRENT_VIEW===i.key?'active':''}" data-navkey="${i.key}">

          ${badges[i.key]?`<span class="navbadge">${badges[i.key]}</span>`:''}

  sidenav.querySelectorAll('button[data-navkey]').forEach(btn=>{
    btn.addEventListener('click', ()=>navigateTo(btn.getAttribute('data-navkey')));
  });

  bottomrow.innerHTML = items.slice(0,6).map(i=>`

    btn.addEventListener('click', ()=>navigateTo(btn.getAttribute('data-navkey')));
  });
}

function navBadgeCounts(){
  try{
    const today = todayISODate();
    return {
      dashboard: (DB.leads.filter(l=>l.status==='New').length) || null,
      leads: DB.leads.filter(l=>l.status!=='Won'&&l.status!=='Lost'&&l.followUpDate&&l.followUpDate<=today).length || null,
      quotes: DB.quotes.filter(q=>q.status==='Sent').length || null,
      bookings: DB.bookings.filter(b=>b.serviceDate===today && b.status!=='Cancelled').length || null,
      jobs: DB.jobs.filter(j=>j.status==='Scheduled' && j.scheduledDate<=today).length || null,
      invoices: DB.invoices.filter(i=>computeInvoiceStatus(i)==='Overdue').length || null,
      myjobs: DB.jobs.filter(j=>j.assignedStaffId===DB.currentUser.staffId && j.status!=='Completed' && j.status!=='Cancelled').length || null,
      compliance: complianceExpiringSoon().length || null,
      keycustody: DB.keyCustody.filter(keyCustodyOverdue).length || null,
    };
  }catch(e){ return {}; }
}

function navigateTo(key, params){
  const allowed = visibleNavItems().map(i=>i.key);
  if(!allowed.includes(key) && key!=='about'){ key = ROLES[DB.currentUser.role].landing; }
  CURRENT_VIEW = key; CURRENT_PARAMS = params||{};
  renderNav();
  const root = document.getElementById('view-root');
  root.innerHTML = '';
  const fn = VIEW_REGISTRY[key];
  if(typeof fn === 'function'){
    try{ fn(root, CURRENT_PARAMS); }
    catch(err){
      console.error(err);
      root.innerHTML = `<div class="card"><h2>Something went wrong showing this screen</h2>
        <p class="muted">${escapeHtml(err.message)}</p>
        <button class="btn primary" onclick="navigateTo('dashboard')">Back to Dashboard</button></div>`;
    }
  } else {
    root.innerHTML = `<div class="card"><h2>Coming soon</h2><p class="muted">This screen (${escapeHtml(key)}) isn't built yet.</p></div>`;
  }
  window.scrollTo(0,0);
}

/* === APP:INIT === */
function currentLogoDataUri(){ return (DB.settings && DB.settings.customLogoDataUri) ? DB.settings.customLogoDataUri : LOGO_DATA_URI; }
function refreshTopbarBrand(){
  // Re-applies logo/business name/tagline to the topbar. Must be called again after any
  // Content Manager save — the topbar lives outside #view-root, so navigateTo() alone never touches it.
  document.getElementById('logo-img').src = currentLogoDataUri();
  document.querySelector('.brandtext strong').textContent = DB.settings.businessName || 'Apelix Cleaning World';
  document.querySelector('.brandtext span').textContent = DB.settings.tagline || 'Where Quality Shines.';
}
function bindTopbar(){
  refreshTopbarBrand();
  renderRoleOptions();
  document.getElementById('role-select').addEventListener('change', function(e){
    const role = e.target.value;
    DB.currentUser.role = role;
    DB.currentUser.name = role==='Cleaner' ? (DB.staff[0]?DB.staff[0].name:'Cleaner (demo view)') : 'Owner';
    if(role==='Cleaner' && DB.staff[0]) DB.currentUser.staffId = DB.staff[0].id;
    toast('Switched to '+role+' view. '+ROLES[role].note, 'info');
    navigateTo(ROLES[role].landing);
  });
  document.getElementById('btn-save-data').addEventListener('click', downloadDataFile);
  document.getElementById('btn-load-data').addEventListener('click', ()=>document.getElementById('file-load-input').click());
  document.getElementById('file-load-input').addEventListener('change', handleFileInputChange);
}

function initApp(){
  bindTopbar();
  const hydrated = hydrateFromCloudState();
  if(!hydrated){
    markClean('No data file loaded — use Save Data File to create one, or make changes to start auto-saving to the cloud');
    if(!DB.settings.firstUseTourSeen){
      navigateTo('about', {tour:true});
    } else {
      navigateTo(ROLES[DB.currentUser.role].landing);
    }
  }
  initCloudPersistence();
}

document.addEventListener('DOMContentLoaded', initApp);

</script>
